#
# Alif Ensemble E8 DevKit board bring-up for the Ethos-U85 NPU, running on the
# Cortex-M55 high-performance (HP) core. Derived from the pack's
# Boards/DevKit-e8/Layers/M55_HP/Board_HP-U85.clayer.yml and trimmed to what a
# ExecuTorch camera/LCD inference runner needs: device startup, the Secure
# Enclave services (clocks, pin mux), a UART-backed stdout on the PRG USB
# connector, the Ethos-U driver, and the MT9M114 camera on MIPI CSI-2 (CPI
# driver behind the vStream VideoIn interface) for live input, plus the LCD.
# Ethernet, USB, VIO and the other vStream drivers are omitted.
layer:
  type: Board
  description: DevKit-E8 camera and LCD for Ethos-U85 inference on M55_HP
  for-board: Alif Semiconductor::DevKit-E8
  for-device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
  device: :M55_HP

  processor:
    trustzone: off

  connections:
    - connect: DevKit-E8 Board
      provides:
        - STDIN
        - STDOUT
        - STDERR
        - CMSIS_VSTREAM_VIDEO_IN
        - Heap: 98304

  define:
    - CMSIS_target_header: \"DevKit-E8.h\"
    - ETHOSU85
    - FINGERSPELL_LCD
    # Voice replies: the I2S mics -> MFCC on the M55 -> the "kws" method on the NPU -> a
    # reply row on the LCD (src/fs_voice*.c, documentation/voice-plan-status.md). Remove
    # this define to ship the camera-only build.
    - APP_VOICE
    # The runner's memory pools (src/app_main.cpp) do not fit the 1 MB DTCM
    # that the Alif linker scripts use for .bss. Place them in the bulk SRAM0
    # (4 MB at 0x02000000, the only bulk SRAM the Ethos-U85 can reach; the
    # first 64 kB hold the A32 boot stub) via the section named here. Budget
    # (RTE/Device/.../app_mem_regions.h): camera ring 0.6 MB + method pool 1 MB
    # + temp pool 1 MB (Vela needs 321 KiB) + LCD frame buffer 0.75 MB = 3.3 MB.
    - APP_POOL_SECTION: \".bss.ai_pool\"
    - APP_METHOD_POOL_SIZE: 0x100000
    - APP_TEMP_POOL_SIZE: 0x180000  # 1.5 MB: Vela scratch of the landmark method is 1185 KiB (detector 886 KiB)

  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-Driver@^2.10.0
    - pack: ARM::ethos-u-core-driver@^1.26.2

  misc:
    - for-compiler: AC6
      Link:
        - '--diag_suppress 6312,6314,6329,6848'

  components:
    - component: Device:Startup

    - component: BSP:Board Config
    - component: BSP:DevKit Config&DevKit-e8
    # Camera: MT9M114 sensor (configured over I2C1) on MIPI CSI-2, captured by
    # the CPI into SRAM via DMA. The image format is
    # RTE_MT9M114_CAMERA_SENSOR_MIPI_IMAGE_CONFIG in RTE_Device.h (5 = 320x320
    # RGB565: square, no Bayer demosaicing on the CPU).
    - component: BSP:External peripherals:CAMERA Sensor MT9M114
    - component: BSP:External peripherals:ILI9806E LCD panel

    - component: CMSIS:CORE

    - component: CMSIS Driver:I2C
    # Microphones: the two I2S MEMS mics on I2S3 (Driver_SAI3, IRQ mode, mono 16 kHz
    # 16-bit, src/fs_voice_capture.c). Driven directly, not through vStream AudioIn,
    # which defaults to the HE-only LPI2S and receives stereo. Requires the DMA
    # component below even in IRQ mode (pack condition).
    - component: CMSIS Driver:SAI
    - component: CMSIS Driver:USART
    - component: CMSIS Driver:vStream:VideoIn&DevKit-E8

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom

    - component: Device:SOC Peripherals:CPI
    - component: Device:SOC Peripherals:DMA
    - component: Device:SOC Peripherals:GPIO
    - component: Device:SOC Peripherals:MHU
    - component: Device:SOC Peripherals:MIPI CSI2
    - component: Device:SOC Peripherals:CDC
    - component: Device:SOC Peripherals:MIPI DSI
    - component: Device:SOC Peripherals:MIPI DSI CSI2 DPHY
    - component: Device:SOC Peripherals:PINCONF

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U85

    - component: Services:Retarget IO:STDERR
    - component: Services:Retarget IO:STDIN
    - component: Services:Retarget IO:STDOUT
    - component: Services:Secure Enclave:core&Source
    - component: Services:Secure Enclave:Initialization Helper&Source

  groups:
    - group: Board
      files:
        - file: ./main.c
        - file: ./main.h
        - file: ./DevKit-E8.h
        - file: ./ethos_setup.c
        - file: ./retarget_stdio.c

    - group: Ethos Interface
      files:
        - file: ./ethosu_cb_dcache.c

  # The pack's linker scripts keep every .bss in DTCM; these copies add the
  # .bss.ai_pool section in bulk SRAM and a 32 kB main stack.
  linker:
    - regions: ./RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
    - script: ./linker_ac6_mram.sct.src
      for-compiler: AC6
    - script: ./linker_gnu_mram.ld.src
      for-compiler: GCC
    - script: ./linker_gnu_mram.ld.src
      for-compiler: CLANG
