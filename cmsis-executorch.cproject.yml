#
# The application: a headless runner that loads the embedded .pte and runs one
# inference on the Ethos-U85. The AI layer (generated by create_ai_layer.py)
# brings the ExecuTorch runtime, the operator components and the model data;
# the Board layer brings the board bring-up.
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./src/app_main.cpp
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading, so it builds for bare metal (BSD-3-Clause, see
        # src/LICENSE-ExecuTorch).
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp
        - file: ./src/fs_api.h
        - file: ./src/fs_display.cpp
          for-context: +DevKit-E8
        - file: ./src/fs_display.h
        # The MT9M114 camera (vStream VideoIn) is only in the DevKit-E8 board layer.
        - file: ./src/fs_camera.c
          for-context: +DevKit-E8
        - file: ./src/fs_camera.h
        # Palm detector CPU side (resize, anchors, decode, box rule, tracking, crop). Pure
        # C99, every target; host tests in tests/host/test_fs_detect.c.
        - file: ./src/fs_detect.c
          optimize: speed  # the per-frame resize and crop: 20 ms at the Debug build's -O1
        - file: ./src/fs_detect.h
        # Hand landmark CPU side: rotated crop, decode, keypoint MLP. Pure C99, every target;
        # host tests in tests/host/test_fs_landmark.c.
        - file: ./src/fs_landmark.c
          optimize: speed
        - file: ./src/fs_landmark.h
        # Decoder (fs_api.h): per-frame letter probabilities to text. Pure C99, no
        # hardware, for every target; host tests in tests/host/test_fs_decoder.c.
        - file: ./src/fs_decoder.c

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
